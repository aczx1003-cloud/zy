<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>资源几何站</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    font-family: system-ui, sans-serif;
    overflow-x: hidden;
    color: #fff;
  }
  #particleCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }
  .glass-container {
    position: relative;
    z-index: 2;
    max-width: 700px;
    width: 90%;
    margin: 0 auto;
    padding: 80px 0;
  }
  .header {
    text-align: center;
    margin-bottom: 40px;
  }
  .header h1 {
    font-size: 36px;
    background: linear-gradient(90deg,#66ccff,#cc66ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header p {
    color: #aaa;
    margin-top: 8px;
    font-size: 15px;
  }
  .card {
    background: rgba(20,22,44,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: all 0.3s;
  }
  .card:hover {
    transform: scale(1.02);
    border-color: #66ccff;
  }
  .card h3 {
    font-size: 20px;
    margin-bottom: 8px;
  }
  .card p {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .card button {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg,#66ccff,#cc66ff);
    color: #000;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="glass-container">
  <div class="header">
    <h1>资源几何站</h1>
    <p>学习资料 | 影视动漫 | 持续更新</p>
  </div>

  <div class="card" onclick="location.href='./study.html'">
    <h3>📚 学习资料</h3>
    <p>高中课程、编程教程、考试资料、软件教程</p>
    <button>进入查看</button>
  </div>

  <div class="card" onclick="location.href='./video.html'">
    <h3>🎬 影视资源</h3>
    <p>电影、剧集、动漫、纪录片、高清合集</p>
    <button>进入查看</button>
  </div>
</div>

<script>
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let w = window.innerWidth;
let h = window.innerHeight;

function resizeCanvas() {
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w;
  canvas.height = h;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const colors = [
  '#66ccff', '#cc66ff', '#ff66cc',
  '#66ffcc', '#ffffff', '#ffcc66'
];

const connectionDistance = 140;

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    const side = Math.floor(Math.random() * 4);
    if (side === 0) {
      this.x = Math.random() * w;
      this.y = -10;
    } else if (side === 1) {
      this.x = w + 10;
      this.y = Math.random() * h;
    } else if (side === 2) {
      this.x = Math.random() * w;
      this.y = h + 10;
    } else {
      this.x = -10;
      this.y = Math.random() * h;
    }
    this.vx = (Math.random() - 0.5) * 1.3;
    this.vy = (Math.random() - 0.5) * 1.3;
    this.r = Math.random() * 1.8 + 1;
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < -30 || this.x > w + 30 || this.y < -30 || this.y > h + 30) {
      this.reset();
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

const particles = Array.from({ length: 70 }, () => new Particle());

function animate() {
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, 0, w, h);

  particles.forEach(p => {
    p.update();
    p.draw();
  });

  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.hypot(dx, dy);
      if (dist < connectionDistance) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(102, 204, 255, ${1 - dist / connectionDistance})`;
        ctx.lineWidth = 0.5;
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
