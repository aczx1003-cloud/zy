<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源共享库</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f5fa;
    min-height: 100vh;
    padding: 30px 20px;
    max-width: 700px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h2 {
    font-size: 26px;
    font-weight: 700;
    color: #1d2129;
    margin-bottom: 6px;
  }
  .clock {
    font-size: 15px;
    color: #86909c;
  }

  .search-box {
    display: flex;
    gap: 10px;
    background: #fff;
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 6px 20px rgba(0,20,60,0.07);
    margin-bottom: 28px;
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    background: transparent;
  }
  .search-box button {
    background: #4080ff;
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }

  .item {
    background: #fff;
    border-radius: 22px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 6px 18px rgba(0,20,60,0.06);
  }
  .item .title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #1d2129;
  }
  .item .url {
    color: #666;
    font-size: 14px;
    word-break: break-all;
  }
</style>
</head>

<body>

<div class="header">
  <h2>📁 资源共享库</h2>
  <div class="clock" id="clock"></div>
</div>

<div class="search-box">
  <input id="keyword" type="text" placeholder="搜索资源名称">
  <button onclick="doSearch()">搜索</button>
</div>

<div id="container">
  <div class="item" data-key="疯狂动物城2">
    <div class="title">🎬 疯狂动物城2</div>
    <div class="url">https://pan.quark.cn/s/b9fef37464e4</div>
  </div>
</div>

<script>
function updateClock() {
  let now = new Date();
  let y = now.getFullYear();
  let m = String(now.getMonth()+1).padStart(2,'0');
  let d = String(now.getDate()).padStart(2,'0');
  let h = String(now.getHours()).padStart(2,'0');
  let i = String(now.getMinutes()).padStart(2,'0');
  let s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').innerText = `${y}-${m}-${d} ${h}:${i}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

function doSearch() {
  let kw = document.getElementById('keyword').value.trim().toLowerCase();
  let items = document.querySelectorAll('.item');
  items.forEach(el => {
    let key = el.getAttribute('data-key').toLowerCase();
    el.style.display = key.includes(kw) ? 'block' : 'none';
  });
}
</script>
</body>
</html>
