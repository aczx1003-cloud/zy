<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源几何站</title>
<style>
  * {
    margin:0;
    padding:0;
    box-sizing:border-box;
  }
  body {
    background:#000;
    font-family:system-ui, sans-serif;
    overflow-x:hidden;
    color:#fff;
  }
  #particleCanvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
  }
  .glass-container {
    position:relative;
    z-index:2;
    max-width:900px;
    margin:0 auto;
    padding:60px 20px;
  }
  .header {
    text-align:center;
    margin-bottom:50px;
  }
  .header h1 {
    font-size:42px;
    background:linear-gradient(90deg,#66ccff,#cc66ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .header p {
    color:#aaa;
    margin-top:10px;
    font-size:16px;
  }
  .card {
    background:rgba(20,22,44,0.5);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:16px;
    padding:30px;
    margin-bottom:24px;
    backdrop-filter:blur(6px);
    cursor:pointer;
    transition:all 0.3s;
  }
  .card:hover {
    transform:scale(1.02);
    border-color:#66ccff;
  }
  .card h3 {
    font-size:22px;
    margin-bottom:10px;
  }
  .card p {
    color:#aaa;
    margin-bottom:20px;
  }
  .card button {
    padding:10px 20px;
    border-radius:10px;
    border:none;
    background:linear-gradient(90deg,#66ccff,#cc66ff);
    color:#000;
    font-weight:bold;
    cursor:pointer;
  }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="glass-container">
  <div class="header">
    <h1>资源几何站</h1>
    <p>学习资料 | 影视动漫 | 持续更新</p>
  </div>

  <div class="card" onclick="location.href='study.html'">
    <h3>📚 学习资料</h3>
    <p>高中课程、编程教程、考试资料、软件教程</p>
    <button>进入查看</button>
  </div>

  <div class="card" onclick="location.href='video.html'">
    <h3>🎬 影视资源</h3>
    <p>电影、剧集、动漫、纪录片、高清合集</p>
    <button>进入查看</button>
  </div>
</div>

<script>
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let w = window.innerWidth;
let h = window.innerHeight;
const particles = [];
const COUNT = 50;
const colors = ['#66ccff','#cc66ff','#ff66cc','#66ffcc','#ffffff'];

class Particle{
  constructor(){
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.r = Math.random() * 1.5 + 0.5;
    this.vx = (Math.random()-0.5)*1;
    this.vy = (Math.random()-0.5)*1;
    this.color = colors[Math.floor(Math.random()*colors.length)];
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    if(this.x < 0 || this.x > w) this.vx *= -1;
    if(this.y < 0 || this.y > h) this.vy *= -1;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

function init(){
  for(let i=0;i<COUNT;i++){
    particles.push(new Particle());
  }
}

function animate(){
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0,0,w,h);
  particles.forEach(p=>{
    p.update();
    p.draw();
  });
  requestAnimationFrame(animate);
}

init();
animate();

window.addEventListener('resize',()=>{
  w = window.innerWidth;
  h = window.innerHeight;
});
</script>

</body>
</html>
